<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>網路工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L3 18l3 3 5.7-5.7a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.7-3.7z"/></svg>
      </div>
      <div class="brand-text">
        <strong>網路工具箱</strong>
        <span>NETWORK TOOLKIT</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center"><a class="nav-link-btn" href="https://liuu.loc.cc/" target="_blank" rel="noopener" title="回導航站"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>導航站</a><div class="count-badge">共 <b>12</b> 個工具</div><button type="button" class="compact-btn" id="compactBtn" aria-pressed="false">緊湊</button></div>
  </header>

  <section class="hero">
    <h1>今天要查什麼？<em>一頁就搞定。</em></h1>
    <p>沒有廣告、沒有註冊。常用的網路工具都放在同一個地方，一個工具一頁，清爽好用。</p>
  </section>

  <div class="search-row">
    <label class="search-box" for="searchInput">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="search" placeholder="搜尋工具名稱或功能…" autocomplete="off" />
      <kbd>/</kbd>
    </label>
  </div>

  <nav class="filters" id="filters" aria-label="分類篩選"></nav>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyState">
      <strong>找不到符合的工具</strong>
      <p>換個關鍵字試試，或清除篩選看全部。</p>
      <button id="clearBtn" type="button">顯示全部工具</button>
    </div>
  </main>

  <div class="foot-note">
    <span>提示：按 <kbd>/</kbd> 快速搜尋；點工具卡片前往該工具的專屬頁面。</span>
    <span id="resultHint"></span>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">已複製</div>

<script src="/assets/tools.js"></script>

<footer style="text-align:center;color:#6B7280;font-size:13px;padding:28px 16px 32px;border-top:1px solid var(--line, #E5E7EB);margin-top:32px">© 2026 HILL 版權所有</footer>
</body>
</html>
