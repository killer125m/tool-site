        ["風速", cur.wind_speed_10m != null ? cur.wind_speed_10m.toFixed(1) + " km/h" : "—"],
        ["今日高 / 低溫", (daily.temperature_2m_max || [])[0] != null ? daily.temperature_2m_max[0].toFixed(0) + "° / " + daily.temperature_2m_min[0].toFixed(0) + "°" : "—"],
        ["今日降雨機率", (daily.precipitation_probability_max || [])[0] != null ? daily.precipitation_probability_max[0] + " %" : "—"],
        ["紫外線指數", uvInfo((daily.uv_index_max || [])[0])],
        ["PM2.5", acur.pm2_5 != null ? acur.pm2_5.toFixed(1) + " µg/m³" : "—"],
        ["PM10", acur.pm10 != null ? acur.pm10.toFixed(1) + " µg/m³" : "—"]
      ];
      $("#wxKv", body).innerHTML = rows.map(function(r){ return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>"; }).join("");
      var days = $("#wxDays", body), dayNames = ["今天", "明天", "後天"];
      days.innerHTML = (daily.time || []).map(function(dstr, i){
        var d = new Date(dstr + "T00:00:00");
        var label2 = (dayNames[i] || "") + " " + (d.getMonth() + 1) + "/" + d.getDate();
        var rain = (daily.precipitation_probability_max || [])[i];
        return '<div class="wx-day"><b>' + label2 + '</b><span class="d-desc">' + esc(WMO[(f.daily.weather_code || [])[i]] || "") + '</span>' +

          '<span class="d-temp">' + daily.temperature_2m_min[i].toFixed(0) + "° – " + daily.temperature_2m_max[i].toFixed(0) + "°</span></div>";

      var uvToday = (daily.uv_index_max || [])[0];

        vEl.className = "verdict bad";

      main.style.display = "";
      setStatus(status, "更新時間：" + (cur.time ? cur.time.replace("T", " ") : "—") + "（當地時間）", "ok");

  function search(){
    var q = $("#wxQuery", body).value.trim();
    pick.innerHTML = "";
    if (!q) { setStatus(status, "請先輸入城市名稱。", "err"); return; }
    setStatus(status, "搜尋城市中…");
    fetchJSON("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(q) + "&count=6&language=zh&format=json")

};

    for (var i = 0; i < 7; i++) mid += rnd(10);
    var all = [Math.floor(code / 10), code % 10].concat(mid.split("").map(function(x){ return +x; }));
    var weights = [1, 9, 8, 7, 6, 5, 4, 3, 2, 1];
    var sum = 0;
    for (var k = 0; k < 10; k++) sum += all[k] * weights[k];
    var check = (10 - (sum % 10)) % 10;
    return letter + mid + check;
  }
  function commonExtras(){
    var card = luhnCard();
    var expM = pad2(1 + rnd(12)), expY = String(new Date().getFullYear() + 1 + rnd(5)).slice(2);
    return {
      信用卡號: fmtCard(card.number) + "（" + card.brand + "）",
      卡片到期日: expM + "/" + expY,
      CVV: digits(card.cvvLen),
      身高: (150 + rnd(46)) + " cm",
      體重: (45 + rnd(56)) + " kg",
      血型: pick(BLOOD)
    };
  }
  function genLocal(code){
    var gender = Math.random() < 0.5 ? "男性" : "女性";
    var dob = randomDOB();
    var ex = commonExtras();
    var d = {
      性別: gender, 生日: dob.date, 年齡: String(dob.age) + " 歲",
      信用卡號: ex.信用卡號, 卡片到期日: ex.卡片到期日, CVV: ex.CVV,
      身高: ex.身高, 體重: ex.體重, 血型: ex.血型
    };
    if (code === "tw") {
      var sn = pick(TW.surnames), gn = pick(gender === "男性" ? TW.male : TW.female);
      var city = pick(TW.cities);
      var road = pick(TW.roads), num = 1 + rnd(300);
      var addr = city[0] + city[1] + road + num + "號";
      if (Math.random() < 0.3) addr = city[0] + city[1] + road + (1 + rnd(50)) + "巷" + num + "號";
      var user = sn[1] + "." + gn[1] + (10 + rnd(90));
      var area = pick(TW.areaCodes);
      d.姓名 = sn[0] + gn[0];
      d.地址 = addr; d.城市 = city[0]; d["州／縣市"] = city[1]; d.郵遞區號 = city[2]; d.國家 = "台灣";
      d.電話 = area + "-" + digits(4) + "-" + digits(4);
      d.手機 = "09" + digits(2) + "-" + digits(3) + "-" + digits(3);
      d.Email = user + "@example.com"; d.使用者名稱 = user; d.密碼 = randomPassword();
      d.職業 = pick(TW.jobs); d.公司 = pick(TW.companies);
      d.身分證字號 = twId(gender);
    } else if (code === "jp") {
      var snj = pick(JP.surnames), gnj = pick(gender === "男性" ? JP.male : JP.female);
      var cj = pick(JP.cities);
      var userj = snj[1] + "." + gnj[1] + (10 + rnd(90));
      d.姓名 = snj[0] + " " + gnj[0] + "（" + snj[1] + " " + gnj[1] + "）";
      d.地址 = cj[0] + (1 + rnd(3)) + "丁目" + (1 + rnd(20)) + "番" + (1 + rnd(30)) + "号";
      d.城市 = cj[0]; d["州／縣市"] = cj[1]; d.郵遞區號 = cj[2]; d.國家 = "日本";
      d.電話 = "03-" + digits(4) + "-" + digits(4);
      d.手機 = "090-" + digits(4) + "-" + digits(4);
      d.Email = userj + "@example.com"; d.使用者名稱 = userj; d.密碼 = randomPassword();
      d.職業 = pick(JP.jobs); d.公司 = pick(JP.companies);
    } else if (code === "kr") {
      var snk = pick(KR.surnames), gnk = pick(gender === "男性" ? KR.male : KR.female);
      var ck = pick(KR.cities);
      var userk = snk[1] + "." + gnk[1] + (10 + rnd(90));
      d.姓名 = snk[0] + gnk[0] + "（" + snk[1] + " " + gnk[1] + "）";
      d.地址 = ck[0] + ck[1] + " " + pick(KR.roads) + " " + (1 + rnd(200)) + "號";
      d.城市 = ck[0]; d["州／縣市"] = ck[1]; d.郵遞區號 = ck[2]; d.國家 = "韓國";
      d.電話 = "02-" + digits(4) + "-" + digits(4);
      d.手機 = "010-" + digits(4) + "-" + digits(4);
      d.Email = userk + "@example.com"; d.使用者名稱 = userk; d.密碼 = randomPassword();
      d.職業 = pick(KR.jobs); d.公司 = pick(KR.companies);
    } else if (code === "it") {
      var sni = pick(IT.surnames), gni = pick(gender === "男性" ? IT.male : IT.female);
      var ci = pick(IT.cities);
      var useri = gni.toLowerCase() + "." + sni.toLowerCase().replace(/ /g, "") + (10 + rnd(90));
      d.姓名 = gni + " " + sni;
      d.地址 = pick(IT.roads) + " " + (1 + rnd(200));
      d.城市 = ci[0]; d["州／縣市"] = ci[1]; d.郵遞區號 = ci[2]; d.國家 = "義大利";
      d.電話 = "+39 06 " + digits(4) + " " + digits(4);
      d.手機 = "+39 333 " + digits(3) + " " + digits(4);
      d.Email = useri + "@example.com"; d.使用者名稱 = useri; d.密碼 = randomPassword();
      d.職業 = pick(IT.jobs); d.公司 = pick(IT.companies);
    }
    return d;
  }
  function genRemote(country, done, fail){
    fetchJSON("https://randomuser.me/api/?nat=" + country.nat + "&results=1&inc=name,gender,dob,location,phone,cell,email,login,nat", 15000)
      .then(function(j){
        var u = (j.results || [])[0];
        if (!u) throw new Error("empty");
        var dob = (u.dob && u.dob.date ? u.dob.date : "").slice(0, 10);
        var ex = commonExtras();
        var loc = u.location || {}, st = loc.street || {};
        done({
          姓名: u.name.first + " " + u.name.last,
          性別: u.gender === "female" ? "女性" : "男性",
          生日: dob, 年齡: String(u.dob.age) + " 歲",
          地址: (st.number != null ? st.number + " " : "") + (st.name || ""),
          城市: loc.city || "—", "州／縣市": loc.state || "—",
          郵遞區號: String(loc.postcode == null ? "—" : loc.postcode),
          國家: country.name,
          電話: u.phone || "—", 手機: u.cell || "—",
          Email: u.email || "—", 使用者名稱: (u.login && u.login.username) || "—",
          密碼: (u.login && u.login.password) || randomPassword(),
          職業: pick(JOBS_EN), 公司: pick(COMPANIES_EN),
          信用卡號: ex.信用卡號, 卡片到期日: ex.卡片到期日, CVV: ex.CVV,
          身高: ex.身高, 體重: ex.體重, 血型: ex.血型
        });
      })
      .catch(function(){ fail(); });
  }

  body.innerHTML =
    '<div class="verdict"><b>以下皆為虛構測試資料，非真實個人資料</b><div class="v-sub">僅供開發測試、填表練習使用，請勿拿去冒充他人或從事詐騙。</div></div>' +
    '<div class="row" style="margin-top:14px">' +
      '<div class="field" style="flex:1 1 160px"><label for="idgCountry">國家</label><select class="select" id="idgCountry">' +
        COUNTRIES.map(function(c, i){ return '<option value="' + c.code + '"' + (i === 0 ? " selected" : "") + ">" + c.name + "</option>"; }).join("") +
      "</select></div>" +
      '<button type="button" class="btn" id="idgGen" style="align-self:flex-end">重新產生</button>' +
    "</div>" +
    '<div class="status-line" id="idgStatus"></div>' +
    '<div id="idgFields" style="margin-top:6px"></div>' +
    '<div class="row" style="margin-top:14px"><button type="button" class="btn" id="idgCopyAll">全部複製</button></div>' +
    '<hr class="divider">' +
    '<h3 class="subhead">臨時信箱（只能收信）</h3>' +
    '<p class="note">用 mail.tm 建立一個臨時信箱收驗證信或通知信，信箱每 10 秒自動檢查一次。<b>臨時信箱只能收信，不能寄信。</b></p>' +
    '<div class="row">' +
      '<button type="button" class="btn" id="idgMailCreate">建立臨時信箱</button>' +
      '<button type="button" class="btn-ghost" id="idgMailSwap" disabled>把 Email 換成臨時信箱</button>' +
    "</div>" +
    '<div id="idgMailBox" style="display:none;margin-top:12px">' +
      '<dl class="kv"><dt>信箱地址</dt><dd><span id="idgMailAddr">—</span> <button type="button" class="btn-ghost" id="idgMailCopy" style="height:32px;padding:0 12px;font-size:13px">複製</button></dd></dl>' +
      '<div class="row" style="margin-top:10px"><button type="button" class="btn-ghost" id="idgMailRefresh">重新整理收件匣</button></div>' +
      '<div id="idgMsgList" style="margin-top:10px"></div>' +
      '<div class="verdict" id="idgMsgDetail" style="display:none;margin-top:10px"></div>' +
    "</div>" +
    '<div class="status-line" id="idgMailStatus"></div>';

  var current = {};
  var seq = 0;
  function renderFields(){
    var box = $("#idgFields", body);
    box.innerHTML = "";
    FIELD_ORDER.forEach(function(k){
      if (!(k in current)) return;
      var row = ce("div", "idg-row");
      var b = ce("b", "", esc(k));
      var v = ce("span", "v", esc(current[k]));
      var btn = ce("button", "btn-ghost", "複製");
      btn.type = "button";
      btn.addEventListener("click", function(){ copyText(current[k], k + "已複製"); });
      row.appendChild(b); row.appendChild(v); row.appendChild(btn);
      box.appendChild(row);
    });
  }
  function generate(){
    var code = $("#idgCountry", body).value;
    var country = COUNTRIES.filter(function(c){ return c.code === code; })[0] || COUNTRIES[0];
    var my = ++seq;
    setStatus($("#idgStatus", body), "產生資料中…");
    if (country.nat) {
      genRemote(country, function(data){
        if (my !== seq) return;
        current = data;
        renderFields();
        setStatus($("#idgStatus", body), "已產生一組" + country.name + "的測試資料。", "ok");
      }, function(){
        if (my !== seq) return;
        setStatus($("#idgStatus", body), "資料服務暫時無法連線，請按「重新產生」再試一次。", "err");
      });
    } else {
      current = genLocal(code);
      renderFields();
      setStatus($("#idgStatus", body), "已產生一組" + country.name + "的測試資料。", "ok");
    }
  }
  $("#idgCountry", body).addEventListener("change", generate);
  $("#idgGen", body).addEventListener("click", generate);
  $("#idgCopyAll", body).addEventListener("click", function(){
    var lines = FIELD_ORDER.filter(function(k){ return k in current; }).map(function(k){ return k + "：" + current[k]; });
    if (lines.length) copyText(lines.join("\n"), "全部資料已複製");
  });

  /* --- 臨時信箱（mail.tm，只能收信） --- */
  var mail = { token: null, address: null, timer: null, msgs: [] };
  function mailStatus(text, kind){ setStatus($("#idgMailStatus", body), text, kind); }
  function createMailbox(){
    var btn = $("#idgMailCreate", body);
    btn.disabled = true;
    mailStatus("正在取得可用網域…");
    fetchJSON("https://api.mail.tm/domains", 15000)
      .then(function(j){
        var list = (j && j["hydra:member"]) || j;
        if (!Array.isArray(list) || !list.length) throw new Error("no domains");
        var domain = list[0].domain;
        var user = (current["使用者名稱"] || "user").replace(/[^a-zA-Z0-9._-]/g, "").toLowerCase() || "user";
        var address = user + Math.floor(Math.random() * 9000 + 1000) + "@" + domain;
        var pw = randomPassword();
        mailStatus("正在建立信箱 " + address + "…");
        return fetch("https://api.mail.tm/accounts", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ address: address, password: pw })
        }).then(function(r){ if (!r.ok) throw new Error("create " + r.status); return r.json(); })
        .then(function(){
          return fetch("https://api.mail.tm/token", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ address: address, password: pw })
          }).then(function(r){ if (!r.ok) throw new Error("token " + r.status); return r.json(); });
        })
        .then(function(tok){
          mail.token = tok.token; mail.address = address;
          $("#idgMailAddr", body).textContent = address;
          $("#idgMailBox", body).style.display = "";
          $("#idgMailSwap", body).disabled = false;
          btn.textContent = "換一個臨時信箱";
          mailStatus("臨時信箱已建立，開始收信。", "ok");
          refreshMessages();
          if (mail.timer) clearInterval(mail.timer);
          mail.timer = setInterval(function(){
            if (!document.body.contains(body)) { clearInterval(mail.timer); mail.timer = null; return; }
            refreshMessages(true);
          }, 10000);
        });
      })
      .catch(function(){
        mailStatus("臨時信箱建立失敗，請檢查網路後再試。", "err");
      })
      .then(function(){ btn.disabled = false; });
  }
  function refreshMessages(quiet){
    if (!mail.token) return;
    fetch("https://api.mail.tm/messages", { headers: { "Authorization": "Bearer " + mail.token, "Accept": "application/json" } })
      .then(function(r){ if (!r.ok) throw new Error("msgs " + r.status); return r.json(); })
      .then(function(j){
        mail.msgs = j["hydra:member"] || [];
        renderMsgList();
        if (!quiet) mailStatus(mail.msgs.length ? "收件匣有 " + mail.msgs.length + " 封信。" : "收件匣目前沒有信。", "ok");
      })
      .catch(function(){ if (!quiet) mailStatus("讀取信件失敗，請按重新整理再試。", "err"); });
  }
  function renderMsgList(){
    var box = $("#idgMsgList", body);
    if (!mail.msgs.length) {
      box.innerHTML = '<div class="rec"><span>還沒有收到信。把上面的信箱地址拿去註冊或訂閱，信就會出現在這裡。</span></div>';
      return;
    }
    box.innerHTML = "";
    mail.msgs.forEach(function(m){
      var b = ce("button", "msg-item");
      b.type = "button";
      var from = (m.from && (m.from.address || m.from.name)) || "未知寄件人";
      b.innerHTML = "<b>" + esc(m.subject || "（無主旨）") + "</b><small>" + esc(from) + " · " + esc(String(m.createdAt || "").replace("T", " ").slice(0, 16)) + "</small>";
      b.addEventListener("click", function(){ readMessage(m.id); });
      box.appendChild(b);
    });
  }
  function readMessage(id){
    var det = $("#idgMsgDetail", body);
    det.style.display = "";
    det.innerHTML = "讀取信件中…";
    fetch("https://api.mail.tm/messages/" + encodeURIComponent(id), { headers: { "Authorization": "Bearer " + mail.token, "Accept": "application/json" } })
      .then(function(r){ if (!r.ok) throw new Error("read " + r.status); return r.json(); })
      .then(function(m){
        var from = (m.from && (m.from.address || m.from.name)) || "未知寄件人";
        var html = "<b>" + esc(m.subject || "（無主旨）") + "</b><div class=\"v-sub\">寄件人：" + esc(from) + "<br>時間：" + esc(String(m.createdAt || "").replace("T", " ").slice(0, 16)) + "</div>";
        if (m.text) html += "<div style=\"white-space:pre-wrap;margin-top:10px\">" + esc(m.text) + "</div>";
        else if (m.html) html += "<div style=\"margin-top:10px\">" + m.html + "</div>";
        else html += "<div class=\"v-sub\" style=\"margin-top:10px\">這封信沒有內文。</div>";
        det.innerHTML = html;
      })
      .catch(function(){ det.innerHTML = "信件讀取失敗，請再試一次。"; });
  }
  $("#idgMailCreate", body).addEventListener("click", createMailbox);
  $("#idgMailRefresh", body).addEventListener("click", function(){ refreshMessages(false); });
  $("#idgMailCopy", body).addEventListener("click", function(){ if (mail.address) copyText(mail.address, "信箱地址已複製"); });
  $("#idgMailSwap", body).addEventListener("click", function(){
    if (!mail.address) return;
    current["Email"] = mail.address;
    renderFields();
    showToast("Email 已換成臨時信箱");
  });

  generate();
};
</script>
